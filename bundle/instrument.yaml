apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: python-instrumentation
spec:
  exporter:
    endpoint: http://otel-collector.otel:4318
  propagators:
    - tracecontext
    - baggage
    - b3
  python:
    env:
      - name: OTEL_TRACES_SAMPLER
        value: parentbased_traceidratio
      - name: OTEL_TRACES_SAMPLER_ARG
        value: "0.2"
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://otel-collector.otel:4318
      - name: OTEL_EXPORTER_PROMETHEUS_PORT
        value: "18080"
      - name: OTEL_EXPORTER_PROMETHEUS_HOST
        value: 0.0.0.0
      - name: OTEL_METRICS_EXPORTER
        value: prometheus
      - name: OTEL_PYTHON_LOG_CORRELATION
        value: "true"
      - name: OTEL_PYTHON_LOG_CORRELATION_ENABLED
        value: "true"
      - name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED
        value: "false"
    image: docker-image.cai-inc.com/geekops/autoinstrumentation-python:0.135.0-5-g198ae969
    resourceRequirements:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    k8s-app: python-exporter
  name: python-exporter
  namespace: prod-gpu
spec:
  endpoints:
    - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      interval: 30s
      path: /metrics
      port: manage
      relabelings:
        - action: replace
          regex: (.*)
          sourceLabels:
            - __address__
          targetLabel: instance
        - action: replace
          regex: (.*)
          sourceLabels:
            - __meta_kubernetes_service_label_app_type
          targetLabel: service
        - action: replace
          regex: (.*)
          sourceLabels:
            - __meta_kubernetes_service_label_name
          targetLabel: app_name
        - action: replace
          regex: (.*)
          sourceLabels:
            - __meta_kubernetes_namespace
          targetLabel: env_name
      scheme: http
  jobLabel: k8s-app
  selector:
    matchLabels:
      app_type: python